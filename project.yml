name: SoulFireControl
options:
  bundleIdPrefix: com.soulfire
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  defaultConfig: Release
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    ASSETCATALOG_COMPILER_SKIP_VALIDATION: "YES"
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: "NO"
targets:
  SoulFireControl:
    type: application
    platform: iOS
    sources:
      - SoulFireControl/Sources
      - SoulFireControl/Resources
    info:
      path: SoulFireControl/Support/Info.plist
      properties:
        CFBundleDisplayName: SoulFire Control
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soulfire.control
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        SWIFT_STRICT_CONCURRENCY: minimal
